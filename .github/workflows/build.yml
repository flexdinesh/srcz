name: Build

# Builds every distribution asset for one commit (decision 0079); release.yml
# (stable tags) and ci.yml (the edge prerelease) call it and publish the
# result. cli (Go archives, archive smoke) -> desktop-linux and desktop-macos
# (packages bundling those binaries, smoke checks) -> assets (the expected set,
# checksums.txt). Every job uploads an assets-* artifact; callers download them
# all with pattern assets-*. image (decision 0125) builds the container image
# from the same linux binaries and uploads it as the image artifact, which
# callers push. Nothing is committed or pushed.

on:
  workflow_call:
    inputs:
      ref:
        description: Full commit SHA to build
        required: true
        type: string
      version:
        description: Version stamped into the binaries and packages and used in asset names (X.Y.Z, or 0.0.0-edge)
        required: true
        type: string
      retention-days:
        description: Days to keep the asset artifacts
        required: false
        type: number
        default: 30
      macos-arches:
        description: Space-separated macOS architectures to build; arm64 must be one (the smoke tests run it)
        required: false
        type: string
        default: amd64 arm64

permissions:
  contents: read

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # Installs Go, Node, and pnpm from mise.lock (decision 0038). Bump
      # `version` with mise.toml min_version.
      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.18

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/pnpm/store
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-dependencies-${{ hashFiles('mise.lock', 'pnpm-lock.yaml', 'apps/zero/go.sum') }}
          restore-keys: ${{ runner.os }}-dependencies-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Checks run locally before push; the build still makes its shipped assets.
      - name: Build frontend
        run: mise run build:web

      - name: Build CLI archives
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          MACOS_ARCHES: ${{ inputs.macos-arches }}
        run: |
          set -euo pipefail

          commit="$(git rev-parse --short=12 HEAD)"
          date="$(git show -s --format=%cI HEAD)"
          module="github.com/flexdinesh/zero/internal/version"

          rm -rf release-dist
          mkdir -p release-dist

          targets=(linux/amd64 linux/arm64)
          for arch in $MACOS_ARCHES; do
            targets+=("darwin/${arch}")
          done
          for target in "${targets[@]}"; do
            goos="${target%/*}"
            goarch="${target#*/}"
            archive_dir="zero_${VERSION}_${goos}_${goarch}"
            mkdir -p "release-dist/${archive_dir}"

            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" go build \
              -trimpath \
              -ldflags="-s -w -X ${module}.Version=${VERSION} -X ${module}.Commit=${commit} -X ${module}.Date=${date}" \
              -o "release-dist/${archive_dir}/zero" \
              ./apps/zero

            cp README.md LICENSE "release-dist/${archive_dir}/"
            tar -C release-dist -czf "release-dist/${archive_dir}.tar.gz" "${archive_dir}"
            rm -rf "release-dist/${archive_dir}"
          done

      # Run the shipped linux/amd64 binary: version stamp and embedded UI.
      - name: Smoke test CLI archive
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          dir="$(mktemp -d)"
          tar -C "$dir" -xzf "release-dist/zero_${VERSION}_linux_amd64.tar.gz"
          bin="$dir/zero_${VERSION}_linux_amd64/zero"
          "$bin" --version | grep -F "zero ${VERSION} $(git rev-parse --short=12 HEAD) "
          "$bin" "$dir" --port 7999 --no-open &
          trap 'kill $!' EXIT
          for _ in $(seq 50); do curl -fsS -o /dev/null http://127.0.0.1:7999/ && break; sleep 0.2; done
          curl -fsS http://127.0.0.1:7999/ | grep -q '<div id="root"'

      - name: Upload CLI archives
        uses: actions/upload-artifact@v7
        with:
          name: assets-archives
          path: release-dist/*.tar.gz
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
          compression-level: 0

  # The container image (decision 0125): the archives' linux binaries on
  # distroless, built for both architectures as one OCI archive. Its Dockerfile
  # only copies, so no emulation is needed.
  image:
    needs: cli
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Download CLI archives
        uses: actions/download-artifact@v8
        with:
          name: assets-archives
          path: release-dist

      - name: Extract linux binaries
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          for arch in amd64 arm64; do
            mkdir -p "image-context/linux/${arch}"
            tar -C "image-context/linux/${arch}" --strip-components=1 \
              -xzf "release-dist/zero_${VERSION}_linux_${arch}.tar.gz" \
              "zero_${VERSION}_linux_${arch}/zero"
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build amd64 image for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: image-context
          file: apps/zero/Dockerfile
          platforms: linux/amd64
          tags: zero:smoke
          load: true
          provenance: false

      # The README recipe: the default command serves the mounted directory.
      - name: Smoke test image
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          docker run --rm zero:smoke --version | grep -F "zero ${VERSION} $(git rev-parse --short=12 HEAD) "
          dir="$(mktemp -d)"
          docker run -d --name zero-smoke -p 127.0.0.1:7999:7971 -v "$dir:$dir" -w "$dir" --user "$(id -u):$(id -g)" zero:smoke
          trap 'docker logs zero-smoke; docker rm -f zero-smoke' EXIT
          for _ in $(seq 50); do curl -fsS -o /dev/null http://127.0.0.1:7999/ && break; sleep 0.2; done
          curl -fsS http://127.0.0.1:7999/ | grep -q '<div id="root"'

      - name: Build multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: image-context
          file: apps/zero/Dockerfile
          platforms: linux/amd64,linux/arm64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ inputs.ref }}
          provenance: false
          outputs: type=oci,dest=image/zero.tar

      # Not assets-*: the image is pushed to ghcr.io, never attached to a
      # release.
      - name: Upload image
        uses: actions/upload-artifact@v7
        with:
          name: image
          path: image/zero.tar
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  # The desktop app (decisions 0094, 0095) bundles the archives' Go binary as
  # resources/bin/zero. mygo needs no cgo, so one Linux runner builds both
  # architectures. apps/desktop needs Go 1.27: GOTOOLCHAIN fetches the toolchain
  # go.mod names, verified against sum.golang.org.
  desktop-linux:
    needs: cli
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.18

      - name: Download CLI archives
        uses: actions/download-artifact@v8
        with:
          name: assets-archives
          path: release-dist

      - name: Package desktop app
        env:
          VERSION: ${{ inputs.version }}
          GOTOOLCHAIN: go1.27.3
        run: apps/desktop/scripts/package.sh linux "$VERSION" release-dist desktop-dist

      # amd64 only: the runner cannot execute arm64 binaries.
      - name: Smoke test desktop packages
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          dir="$(mktemp -d)"
          tar -C "$dir" -xzf "desktop-dist/zero-desktop_${VERSION}_linux_amd64.tar.gz"
          "$dir/zero-desktop" --version | grep -Fx "zero-desktop ${VERSION} $(git rev-parse --short=12 HEAD)"
          "$dir/bin/zero" --version | grep -F "zero ${VERSION} "
          grep -E '^MimeType=(.*;)?x-scheme-handler/zero(;|$)' "$dir/zero-desktop.desktop"
          test -f "$dir/zero-desktop.png"

      - name: Upload desktop packages
        uses: actions/upload-artifact@v7
        with:
          name: assets-desktop-linux
          path: desktop-dist/*
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
          compression-level: 0

  # Ad-hoc signed (mygo.json macos.signingIdentity "-"); signing needs macOS.
  desktop-macos:
    needs: cli
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.18

      - name: Download CLI archives
        uses: actions/download-artifact@v8
        with:
          name: assets-archives
          path: release-dist

      - name: Package desktop app
        env:
          VERSION: ${{ inputs.version }}
          MACOS_ARCHES: ${{ inputs.macos-arches }}
          GOTOOLCHAIN: go1.27.3
        run: apps/desktop/scripts/package.sh darwin "$VERSION" release-dist desktop-dist "$MACOS_ARCHES"

      # arm64 only: macos-latest runs on Apple silicon.
      - name: Smoke test desktop packages
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          dir="$(mktemp -d)"
          ditto -x -k "desktop-dist/zero-desktop_${VERSION}_darwin_arm64.zip" "$dir"
          app="$dir/zero-desktop.app/Contents"
          "$app/MacOS/zero-desktop" --version | grep -Fx "zero-desktop ${VERSION} $(git rev-parse --short=12 HEAD)"
          "$app/Resources/bin/zero" --version | grep -F "zero ${VERSION} "
          codesign --verify "$dir/zero-desktop.app"
          scheme="$(plutil -extract CFBundleURLTypes.0.CFBundleURLSchemes.0 raw -o - "$app/Info.plist")"
          if [[ "$scheme" != "zero" ]]; then
            echo "Info.plist registers URL scheme '$scheme', want zero" >&2
            exit 1
          fi

      - name: Upload desktop packages
        uses: actions/upload-artifact@v7
        with:
          name: assets-desktop-macos
          path: desktop-dist/*
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
          compression-level: 0

  assets:
    needs: [cli, desktop-linux, desktop-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download assets
        uses: actions/download-artifact@v8
        with:
          pattern: assets-*
          path: release-dist
          merge-multiple: true

      # The install scripts (decision 0073) download these names; renaming one
      # breaks them for every user at once.
      - name: Check assets and write checksums
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          MACOS_ARCHES: ${{ inputs.macos-arches }}
        run: |
          set -euo pipefail

          expected=()
          for arch in amd64 arm64; do
            expected+=(
              "zero_${VERSION}_linux_${arch}.tar.gz"
              "zero-desktop_${VERSION}_linux_${arch}.tar.gz"
            )
          done
          for arch in $MACOS_ARCHES; do
            expected+=(
              "zero_${VERSION}_darwin_${arch}.tar.gz"
              "zero-desktop_${VERSION}_darwin_${arch}.zip"
            )
          done

          cd release-dist
          diff <(printf '%s\n' "${expected[@]}" | sort) <(find . -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          mkdir -p ../checksums
          shasum -a 256 "${expected[@]}" > ../checksums/checksums.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v7
        with:
          name: assets-checksums
          path: checksums/checksums.txt
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
